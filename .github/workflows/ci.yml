name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  # ==========================================
  # STAGE 1: LINT & VORGABEN
  # ==========================================
  lint_code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run Linter
        run: npm run lint

  check_restrictions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for TypeScript and Forbidden Frameworks
        run: |
          if find webapp/src server/src -name "*.ts" 2>/dev/null | grep -q .; then
            echo "FEHLER: TypeScript-Dateien gefunden!" && exit 1
          fi
          if grep -E '"(react|vue|@angular|jquery)"' package.json webapp/package.json server/package.json; then
            echo "FEHLER: Verbotenes Framework in package.json gefunden!" && exit 1
          fi

  # ==========================================
  # STAGE 2: AUTOMATISIERTE TESTS
  # ==========================================
  unit_tests:
    runs-on: ubuntu-latest
    needs: [lint_code, check_restrictions]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run Unit Tests
        run: npm test

  # ==========================================
  # STAGE 3: REGULÄRER BUILD (DEBUG & PROD)
  # ==========================================
  build_debug:
    runs-on: ubuntu-latest
    needs: [unit_tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline || npm install

      - name: Build Debug
        run: npm run debug

  build_production:
    runs-on: ubuntu-latest
    needs: [unit_tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline || npm install

      - name: Build Production
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist-${{ github.sha }}
          path: webapp/dist/
          retention-days: 7
